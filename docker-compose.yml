services:
  server:
    build: .
    ports:
      - "10000:10000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:10000}
      DATA_DIR: /var/data
      ROUTING_MODE: path
      TRUST_PROXY: "0"
    volumes:
      - recflare-data:/var/data
    restart: unless-stopped
volumes:
  recflare-data:
